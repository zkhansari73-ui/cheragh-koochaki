<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17351f"><link rel="manifest" href="manifest.webmanifest"><title>خرس کوچولو و جنگل بزرگ</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial;background:radial-gradient(circle at 50% 25%,#527c4a,#17351f 55%,#09180d);color:#fff;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px}header,footer{width:min(900px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(16px,4vw,23px);margin:0}.btn{border:1px solid #ffffff55;background:#102d1bcc;color:white;border-radius:18px;min-height:48px;padding:0 15px;font-weight:bold}.install{background:#ffd662;color:#20321e}.book{width:min(100%,780px);height:100%;margin:auto;display:grid;place-items:center;perspective:1400px}.page{width:min(100%,720px);height:min(100%,720px);aspect-ratio:1;border-radius:22px;background:#f5e8c5;box-shadow:0 25px 70px #0008;display:grid;grid-template-rows:58% 42%;overflow:hidden;touch-action:pan-y}.art{position:relative;display:grid;place-items:center;background:linear-gradient(#8ec5e8 0 36%,#83a950 36% 70%,#375c2e 70%);overflow:hidden}.sun{position:absolute;width:80px;height:80px;border-radius:50%;background:#ffe27a;top:35px;right:55px;box-shadow:0 0 45px #fff09a}.trees{position:absolute;inset:auto 0 0;height:65%;background:repeating-linear-gradient(90deg,transparent 0 8%,#25451f 8% 10%,transparent 10% 18%)}.bear{font-size:clamp(100px,25vw,190px);z-index:2;filter:drop-shadow(0 12px 9px #0005)}.text{background:#fff7df;color:#382b20;padding:clamp(13px,3vw,28px);display:flex;flex-direction:column;justify-content:center;text-align:center}.text h2{margin:0 0 10px;color:#79522a;font-size:clamp(18px,4vw,27px)}.text p{margin:0;line-height:1.9;font-size:clamp(14px,3.2vw,19px)}footer{justify-content:center}.nav{width:56px;font-size:25px}.status{text-align:center;min-width:100px}.turn{animation:turn .35s ease-out}@keyframes turn{from{transform:rotateY(32deg);opacity:.4}to{transform:none;opacity:1}}@media(max-height:650px){.app{padding:6px}.btn{min-height:40px}.page{grid-template-columns:50% 50%;grid-template-rows:1fr}}</style></head><body><div class="app"><header><h1>🐻 خرس کوچولو و جنگل بزرگ</h1><div><button id="install" class="btn install">نصب آفلاین</button> <button id="sound" class="btn">🔇</button></div></header><main class="book"><div id="page" class="page"><div class="art"><div class="sun"></div><div class="trees"></div><div class="bear">🐻</div></div><div class="text"><h2 id="title"></h2><p id="story"></p></div></div></main><footer><button id="next" class="btn nav">‹</button><div class="status"><b><span id="cur">1</span> / 24</b><div id="hint">برای شنیدن داستان 🔊 را بزن</div></div><button id="prev" class="btn nav">›</button></footer></div><script>
const pages=[["خرس کوچولو","در دل یک جنگل بزرگ و سبز، خرس کوچولویی به نام بری با مادرش زندگی می‌کرد. بری مهربان و بازیگوش بود، اما از خیلی چیزها می‌ترسید. مادر می‌گفت: قوی بودن یعنی بترسی و باز هم یک قدم جلو بروی."],["اولین قدم","یک صبح آفتابی، بری تصمیم گرفت به تنهایی تا درخت بلوط بزرگ برود. صدایی از میان بوته‌ها آمد. قلبش تند زد، اما حرف مادر را به یاد آورد و یک قدم جلو رفت."],["چیزی در بوته‌ها","بری آرام شاخه‌ها را کنار زد. ناگهان یک خرگوش کوچک بیرون پرید! بری خندید. آن روز فهمید بعضی چیزهای ترسناک، وقتی نزدیکشان می‌شوی دیگر ترسناک نیستند."],["رودخانه","کمی جلوتر، بری به رودخانه‌ی خروشان رسید. دلش می‌خواست برگردد، اما آن طرف رودخانه مسیر جنگل ادامه داشت. بری نفس عمیقی کشید."],["سنگ اول","بری پنجه‌اش را روی اولین سنگ گذاشت. سنگ لغزید و ترسید، اما فرار نکرد. دوباره امتحان کرد؛ یک قدم و بعد یک قدم دیگر."],["من توانستم!","بری به آن طرف رودخانه رسید. رودخانه همان بود، اما یک چیز تغییر کرده بود: بری. لبخند زد و گفت: من توانستم!"],["باد بزرگ","آسمان تاریک شد و باد میان درختان پیچید. شاخه‌ها تکان خوردند. بری فهمید طوفان در راه است و این بار واقعاً ترسیده بود."],["طوفان","رعد در آسمان پیچید. بری گفت: من می‌ترسم، ولی می‌توانم فکر کنم. اطرافش را نگاه کرد و در جای امنی پناه گرفت."],["بعد از باران","باران آرام شد و خورشید برگشت. بری فهمید هیچ طوفانی برای همیشه نمی‌ماند؛ گاهی باید جای امنی پیدا کنی و صبر کنی تا بگذرد."],["صدای کمک","ناگهان صدای کمک شنید. سنجاب کوچکی روی شاخه‌ای گیر افتاده بود. بری از بالا رفتن می‌ترسید، اما سنجاب به کمک نیاز داشت."],["برای یک دوست","بری آرام از درخت بالا رفت. پاهایش می‌لرزید، اما فقط به شاخه‌ی بعدی نگاه می‌کرد. بالاخره رسید و گفت: نگران نباش، من اینجام."],["شجاعت یعنی کمک کردن","بری سنجاب را نجات داد. سنجاب گفت: تو خیلی شجاعی! بری گفت: ولی من می‌ترسیدم. سنجاب خندید: پس واقعاً شجاع بودی."],["شب در جنگل","خورشید غروب کرد و جنگل تاریک شد. صداهای شب از همه طرف می‌آمدند. بری هیچ‌وقت تنها در تاریکی جنگل نمانده بود."],["دو چشم در تاریکی","دو چشم درخشان ظاهر شد. بری فرار نکرد و پرسید: کی اونجاست؟ جغد پیری بیرون آمد و گفت: شب بخیر خرس کوچولو."],["نور کوچک","جغد گفت: لازم نیست تمام جنگل را ببینی؛ فقط جلوی پایت را ببین. بری به نور ماه نگاه کرد و یک قدم دیگر برداشت."],["درخت افتاده","صبح، درخت بزرگی راه خانه را بسته بود. بری آن را هل داد، اما تکان نخورد. دوباره تلاش کرد و باز هم نشد."],["قوی بودن فقط زور نیست","بری فکر کرد و از شاخه‌ها مثل اهرم استفاده کرد. درخت حرکت کرد. فهمید قوی بودن فقط بازوی بزرگ نیست؛ فکر کردن هم قدرت است."],["دوباره بلند شو","پای بری لغزید و زمین خورد. زانویش درد گرفت، اما بلند شد و گفت: زمین خوردن یعنی تمام شدن راه نیست."],["بزرگ‌ترین ترس","غرشی از پشت درختان آمد. بری بی‌فکر به سمت خطر نرفت؛ فاصله گرفت و راه امن دیگری پیدا کرد. شجاعت یعنی انتخاب امن هم هست."],["راه خانه","بالاخره بوی آشنای خانه را حس کرد. پاهایش خسته و کوله‌اش خاکی بود، اما قدم‌هایش محکم‌تر از صبح شده بودند."],["مادر","مادر جلوی خانه منتظر بود. بری او را بغل کرد و با هیجان از رودخانه، طوفان، سنجاب، تاریکی و درخت بزرگ گفت."],["آیا من قوی شده‌ام؟","بری پرسید: مامان، حالا من قوی شدم؟ مادر گفت: تو از صبح هم قوی بودی؛ بعضی قدرت‌ها را وقتی می‌شناسیم که از آن‌ها استفاده می‌کنیم."],["خرس جدید","روز بعد رودخانه هنوز خروشان و جنگل هنوز بزرگ بود. بری هم گاهی می‌ترسید، اما دیگر فکر نمی‌کرد ترس یعنی ضعیف بودن."],["یک قدم دیگر","بری کوله‌اش را روی شانه انداخت و گفت: لازم نیست از همه‌چیز قوی‌تر باشم؛ فقط باید هر بار که می‌افتم دوباره بلند شوم. شجاعت یعنی با وجود ترس ادامه بدهی. پایان."]];
let i=Math.max(0,Math.min(23,+localStorage.getItem('bear-page')||0)),audioOn=false,startX=0,deferred;
const el=id=>document.getElementById(id), page=el('page');
function draw(){el('title').textContent=pages[i][0];el('story').textContent=pages[i][1];el('cur').textContent=i+1;localStorage.setItem('bear-page',i);if(audioOn)read()}
function read(){speechSynthesis.cancel();if(!audioOn)return;const text=pages[i][0]+'. '+pages[i][1];const u=new SpeechSynthesisUtterance(text);const voices=speechSynthesis.getVoices();const fa=voices.find(v=>/^fa(-|_)/i.test(v.lang))||voices.find(v=>/persian|farsi/i.test(v.name));u.lang=fa?fa.lang:'fa-IR';if(fa)u.voice=fa;u.rate=.82;u.pitch=1.05;u.volume=1;u.onerror=()=>{el('hint').textContent='صدای فارسی گوشی فعال نیست؛ Text-to-Speech فارسی را در تنظیمات گوشی فعال کن'};speechSynthesis.resume();speechSynthesis.speak(u)}
function go(d){let n=i+d;if(n<0||n>23)return;speechSynthesis.cancel();i=n;page.classList.remove('turn');void page.offsetWidth;page.classList.add('turn');draw()}
el('next').onclick=()=>go(1);el('prev').onclick=()=>go(-1);speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();el('sound').onclick=()=>{audioOn=!audioOn;el('sound').textContent=audioOn?'🔊':'🔇';el('hint').textContent=audioOn?'خواندن داستان روشن است':'برای شنیدن داستان 🔊 را بزن';audioOn?read():speechSynthesis.cancel()};
page.onpointerdown=e=>startX=e.clientX;page.onpointerup=e=>{let d=e.clientX-startX;if(Math.abs(d)>45)go(d<0?1:-1)};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});el('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else alert('در Chrome از منوی سه‌نقطه، Install app یا Add to Home screen را بزن.')};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));draw();
</script></body></html>
